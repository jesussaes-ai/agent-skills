# CI de apps/circulo-nueve mientras viva en este repositorio.
# Copia equivalente para cuando se extraiga a su propio repo:
# apps/circulo-nueve/.github/workflows/ci.yml (mantener ambas iguales salvo rutas).
name: Círculo Nueve CI

on:
  push:
    branches: [main]
    paths: ['apps/circulo-nueve/**', '.github/workflows/circulo-nueve-ci.yml']
  pull_request:
    paths: ['apps/circulo-nueve/**', '.github/workflows/circulo-nueve-ci.yml']

permissions:
  contents: read

concurrency:
  group: circulo-nueve-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/circulo-nueve

jobs:
  calidad:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/circulo-nueve/package-lock.json
      - uses: actions/cache@v4
        with:
          path: apps/circulo-nueve/.cache/modelos
          key: modelos-e5-whisper-tesseract-v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  base-de-datos:
    name: Migraciones y RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/circulo-nueve/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run db:start
      - run: npm run test:db

  e2e:
    name: Extremo a extremo (Auth local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/circulo-nueve/package-lock.json
      - uses: actions/cache@v4
        with:
          path: apps/circulo-nueve/.cache/modelos
          key: modelos-e5-whisper-tesseract-v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:start
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/circulo-nueve/playwright-report
            apps/circulo-nueve/test-results
          retention-days: 7
