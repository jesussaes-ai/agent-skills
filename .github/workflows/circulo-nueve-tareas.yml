# Tareas programadas de Círculo Nueve en producción (ver apps/circulo-nueve/docs/despliegue.md):
# ping anti-pausa de Supabase, worker de ingesta de la biblioteca y purga por retención.
# Solo corre si la variable del repositorio CIRCULO_NUEVE_ACTIVO = "true" y existen los secretos.
# Copia equivalente para el repo propio: apps/circulo-nueve/.github/workflows/tareas.yml.
name: Círculo Nueve tareas

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circulo-nueve-tareas
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/circulo-nueve

jobs:
  tareas:
    if: vars.CIRCULO_NUEVE_ACTIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CIRCULO_NUEVE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CIRCULO_NUEVE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.CIRCULO_NUEVE_SITE_URL }}
      CLAMAV_OBLIGATORIO: ${{ vars.CIRCULO_NUEVE_CLAMAV == 'true' && '1' || '0' }}
      VISION_PROVEEDOR_ID: ${{ vars.CIRCULO_NUEVE_VISION_PROVEEDOR_ID }}
    steps:
      - name: Ping anti-pausa de Supabase
        working-directory: .
        run: |
          curl -fsS "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/app_settings?select=id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/circulo-nueve/package-lock.json
      - uses: actions/cache@v4
        with:
          path: apps/circulo-nueve/.cache/modelos
          key: modelos-e5-whisper-tesseract-v2
      - name: ffmpeg (audio y video) y ClamAV opcional
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          if [ "$CLAMAV_OBLIGATORIO" = "1" ]; then
            sudo apt-get install -y -qq clamav && sudo systemctl stop clamav-freshclam || true
            sudo freshclam --quiet
          fi
      - run: npm ci
      - name: Worker de ingesta (procesa la cola y termina)
        run: npm run ingesta:worker
      - name: Purga por retención
        run: npm run retencion:purgar
